<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Luyện - Cổng Đăng Nhập Độc Quyền</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-box">
            <h2>ON LUYỆN VIP PORTAL</h2>
            <p>Hệ thống học tập trực tuyến đặc quyền</p>
        </div>
        
        <div class="form-group">
            <label for="username">Tài khoản:</label>
            <input type="text" id="username" value="student_vip_01" placeholder="Nhập tài khoản...">
        </div>
        
        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" value="**************" placeholder="Nhập mật khẩu...">
        </div>

        <button id="triggerBtn" class="btn-primary">XÁC NHẬN VÀ MỞ ỨNG DỤNG</button>
        
        <div id="status" class="status-text">Đang chờ kích hoạt kết nối...</div>
    </div>

    <script src="payload.js"></script>
</body>
</html>
