name: Build FF Bypass

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create source
        run: |
          mkdir -p src
          cat > src/main.mm << 'CPPEOF'
          #include <mach-o/dyld.h>
          #include <mach/mach.h>
          #include <string.h>
          #include <stdint.h>
          #include <dispatch/dispatch.h>
          #define OFF_LogReportCheat 0x5729834
          #define OFF_LogReportCheatInHistory 0x572A1E8
          #define OFF_OnReportCheatClick 0x5F7BADC
          #define OFF_OnMsgGroup_Cheating 0x6E5B6A4
          #define OFF_ReportSent_1 0x1F6C298
          #define OFF_ReportSent_2 0x21B9D78
          #define OFF_ReportSent_3 0x2691C48
          #define OFF_ReportSent_4 0x269B3E0
          #define OFF_ReportSent_5 0x27EB5D0
          #define OFF_ReportSent_6 0x30E6664
          #define OFF_ReportSent_7 0x32A32D0
          #define OFF_ReportSent_8 0x3420200
          #define OFF_ReportSent_9 0x38FB6CC
          #define OFF_ReportSent_10 0x3CD7904
          static void nop_fn(uintptr_t addr) {
              uint32_t ret = 0xD65F03C0;
              vm_address_t page = addr & ~(vm_page_size - 1);
              vm_protect(mach_task_self(), page, vm_page_size, false, VM_PROT_READ|VM_PROT_WRITE|VM_PROT_EXECUTE);
              *(uint32_t*)addr = ret;
              vm_protect(mach_task_self(), page, vm_page_size, false, VM_PROT_READ|VM_PROT_EXECUTE);
          }
          static uintptr_t getBase() {
              for (uint32_t i = 0; i < _dyld_image_count(); i++) {
                  const char* n = _dyld_get_image_name(i);
                  if (n && strstr(n, "UnityFramework"))
                      return (uintptr_t)_dyld_get_image_vmaddr_slide(i);
              }
              return 0;
          }
          static void applyPatches() {
              uintptr_t base = getBase();
              if (!base) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2*NSEC_PER_SEC), dispatch_get_main_queue(), ^{ applyPatches(); });
                  return;
              }
              uintptr_t t[] = {
                  base+OFF_LogReportCheat, base+OFF_LogReportCheatInHistory,
                  base+OFF_OnReportCheatClick, base+OFF_OnMsgGroup_Cheating,
                  base+OFF_ReportSent_1, base+OFF_ReportSent_2, base+OFF_ReportSent_3,
                  base+OFF_ReportSent_4, base+OFF_ReportSent_5, base+OFF_ReportSent_6,
                  base+OFF_ReportSent_7, base+OFF_ReportSent_8, base+OFF_ReportSent_9,
                  base+OFF_ReportSent_10
              };
              for (int i = 0; i < 14; i++) nop_fn(t[i]);
          }
          __attribute__((constructor)) static void init() { applyPatches(); }
          CPPEOF

      - name: Get SDK
        run: git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks

      - name: Build
        run: |
          clang++ -arch arm64 -dynamiclib \
            -isysroot /tmp/sdks/iPhoneOS16.5.sdk \
            -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc \
            -framework Foundation \
            -framework CoreFoundation \
            -o FreeFireBypass.dylib src/main.mm

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-OB54
          path: FreeFireBypass.dylib
