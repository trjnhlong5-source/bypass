name: Build FreeFireBypass Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: kabiroberai/theos-action@v1
        with:
          sdk-version: "16.5"
          cache: true

      - name: Build dylib
        run: make FINALPACKAGE=1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-OB54
          path: .theos/obj/FreeFireBypass.dylib
          retention-days: 30
