                  b+0x3107518, b+0x31075E4,
                  b+0x31083EC, b+0x31084B8,
                  b+0x3F8856C, b+0x3F88618, b+0x3F88A4C,
                  b+0x3F88F00, b+0x3F89048, b+0x3F89190,
                  b+0x405AF14, b+0x405B318,
                  b+0x42DC8D4, b+0x42DCCA0,
