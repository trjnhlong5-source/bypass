name: Build FF Bypass FULL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create source
        run: |
          mkdir -p src
          cat > src/main.mm << 'CPPEOF'
          #include <mach-o/dyld.h>
          #include <mach/mach.h>
          #include <string.h>
          #include <stdint.h>
          #include <dispatch/dispatch.h>

          // ── Report / Cheat ──────────────────────────────
          #define OFF_LogReportCheat              0x5729834
          #define OFF_LogReportCheatInHistory     0x572A1E8
          #define OFF_OnReportCheatClick          0x5F7BADC
          #define OFF_OnMsgGroup_Cheating         0x6E5B6A4
          #define OFF_ReportSent_1                0x1F6C298
          #define OFF_ReportSent_2                0x21B9D78
          #define OFF_ReportSent_3                0x2691C48
          #define OFF_ReportSent_4                0x269B3E0
          #define OFF_ReportSent_5                0x27EB5D0
          #define OFF_ReportSent_6                0x30E6664
          #define OFF_ReportSent_7                0x32A32D0
          #define OFF_ReportSent_8                0x3420200
          #define OFF_ReportSent_9                0x38FB6CC
          #define OFF_ReportSent_10               0x3CD7904
          #define OFF_ReportSent_b0               0x38FBD7C
          #define OFF_QuickReportPlayer_1         0x2160BAC
          #define OFF_QuickReportPlayer_b0        0x216139C
          #define OFF_ReportPlayer_1              0x33991AC
          #define OFF_ReportPlayer_b0             0x339C378
          #define OFF_ReportPlayer_2              0x33A2314
          #define OFF_ReportPlayer_b1             0x33A62AC
          #define OFF_SendHackerReportRequest     0x469A6BC
          #define OFF_SendHackerReport_b0         0x469AF60

          // ── AntiHack / FFAntihack ───────────────────────
          #define OFF_GetffantihackEnabled        0x44B49DC
          #define OFF_GetEffectiveffantihack      0x44B4A34
          #define OFF_ProcessffantihackOpen       0x44A9378
          #define OFF_ProcessffantihackGGP        0x44AFCA8
          #define OFF_NeedffantihackEmulatorCheck 0x59E321C
          #define OFF_GotoV2AntiHackWindow        0x5411AA0
          #define OFF_RefreshAntiHackRedPoint     0x206DEC4
          #define OFF_OnAntiHackCenterBtnClick    0x20703F0
          #define OFF_OnAntihackBtnClick          0x1F6BBBC
          #define OFF_SetAntiHackButton           0x1AFB0F4
          #define OFF_ShowAntiHackWeb             0x294B3AC
          #define OFF_ClearAntiHackRedPoints      0x424FBE4
          #define OFF_ClearAntiHackFeedback       0x36DBE9C
          #define OFF_InitAntiHackProtect         0x21A1694
          #define OFF_ProcessAntiHackDesc         0x40D9C24

          // ── Hacker detection ───────────────────────────
          #define OFF_ShowHackerDetectedUI        0x5F70D78
          #define OFF_OnGroupJoinHackerNtf        0x6E617A4
          #define OFF_OnMsgMatchMakingHackerNtf   0x6E674A0
          #define OFF_CheckIsClanHacker           0x2B428EC
          #define OFF_RefreshClanHackerRemind     0x2B4253C
          #define OFF_OnClanHackerRemindBtn       0x2B41DEC
          #define OFF_RequestHackerWarningInfo    0x4727C10
          #define OFF_OnRequestCheckHackFinished  0x47280F0
          #define OFF_get_CheckHacker             0x4E6DFA4
          #define OFF_ExistHacker                 0x469885C
          #define OFF_SortByHackerProb            0x469811C

          // ── BỔ SUNG 22 OFFSET THIẾU ──
          #define OFF_get_SkillCheckHackParam     0x448DA38
          #define OFF_set_SkillCheckHackParam     0x448DA40
          #define OFF_SendEventTypeHackClientFix  0x5740048
          #define OFF_IsCheatcodeRoom             0x3E2DB8C
          #define OFF_get_PlayerPrefCheatCode     0x3E2FD98
          #define OFF_set_PlayerPrefCheatCode     0x3E2FECC
          #define OFF_StartAttribute              0x8FD4294
          #define OFF_HackedIsStdLibraryPackage   0x521AE04
          #define OFF_OnReceiveClanWarHackerNtf   0x41BF9F0
          #define OFF_GetClanHackerRemindDetail   0x41CDE00
          #define OFF_RefreshHackView             0x2B9BC24
          #define OFF_OnHackBtnClick_Action       0x2F90810
          #define OFF_OnHackBtnRelease_Action     0x2F908E4
          #define OFF_OnHackBtnClick_Driver       0x3107518
          #define OFF_OnHackBtnRelease_Driver     0x31075E4
          #define OFF_OnHackBtnClick_Passenger    0x31083EC
          #define OFF_OnHackBtnRelease_Passenger  0x31084B8
          #define OFF_HackNB2Transformer          0x2AC7994
          #define OFF_HackTestAddBpExp            0x374B0F8
          #define OFF_PreviewNB2HackTransformer   0x38C6C6C
          #define OFF_HackShowNB2Transformer      0x3D75700
          #define OFF_SetDesc_SkinMod             0x3ABB354

          static void nop_fn(uintptr_t addr) {
              uint32_t ret = 0xD65F03C0;
              vm_address_t page = addr & ~(vm_page_size - 1);
              vm_protect(mach_task_self(), page, vm_page_size, false, VM_PROT_READ|VM_PROT_WRITE|VM_PROT_EXECUTE);
              *(uint32_t*)addr = ret;
              vm_protect(mach_task_self(), page, vm_page_size, false, VM_PROT_READ|VM_PROT_EXECUTE);
          }

          static uintptr_t getBase() {
              for (uint32_t i = 0; i < _dyld_image_count(); i++) {
                  const char* n = _dyld_get_image_name(i);
                  if (n && strstr(n, "UnityFramework"))
                      return (uintptr_t)_dyld_get_image_vmaddr_slide(i);
              }
              return 0;
          }

          static void applyPatches() {
              uintptr_t b = getBase();
              if (!b) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2*NSEC_PER_SEC), dispatch_get_main_queue(), ^{ applyPatches(); });
                  return;
              }
              uintptr_t targets[] = {
                  b+OFF_LogReportCheat, b+OFF_LogReportCheatInHistory,
                  b+OFF_OnReportCheatClick, b+OFF_OnMsgGroup_Cheating,
                  b+OFF_ReportSent_1, b+OFF_ReportSent_2, b+OFF_ReportSent_3,
                  b+OFF_ReportSent_4, b+OFF_ReportSent_5, b+OFF_ReportSent_6,
                  b+OFF_ReportSent_7, b+OFF_ReportSent_8, b+OFF_ReportSent_9,
                  b+OFF_ReportSent_10, b+OFF_ReportSent_b0,
                  b+OFF_QuickReportPlayer_1, b+OFF_QuickReportPlayer_b0,
                  b+OFF_ReportPlayer_1, b+OFF_ReportPlayer_b0,
                  b+OFF_ReportPlayer_2, b+OFF_ReportPlayer_b1,
                  b+OFF_SendHackerReportRequest, b+OFF_SendHackerReport_b0,
                  b+OFF_GetffantihackEnabled, b+OFF_GetEffectiveffantihack,
                  b+OFF_ProcessffantihackOpen, b+OFF_ProcessffantihackGGP,
                  b+OFF_NeedffantihackEmulatorCheck, b+OFF_GotoV2AntiHackWindow,
                  b+OFF_RefreshAntiHackRedPoint, b+OFF_OnAntiHackCenterBtnClick,
                  b+OFF_OnAntihackBtnClick, b+OFF_SetAntiHackButton,
                  b+OFF_ShowAntiHackWeb, b+OFF_ClearAntiHackRedPoints,
                  b+OFF_ClearAntiHackFeedback, b+OFF_InitAntiHackProtect,
                  b+OFF_ProcessAntiHackDesc,
                  b+OFF_ShowHackerDetectedUI, b+OFF_OnGroupJoinHackerNtf,
                  b+OFF_OnMsgMatchMakingHackerNtf, b+OFF_CheckIsClanHacker,
                  b+OFF_RefreshClanHackerRemind, b+OFF_OnClanHackerRemindBtn,
                  b+OFF_RequestHackerWarningInfo, b+OFF_OnRequestCheckHackFinished,
                  b+OFF_get_CheckHacker, b+OFF_ExistHacker, b+OFF_SortByHackerProb,
                  // 22 bổ sung
                  b+OFF_get_SkillCheckHackParam,
                  b+OFF_set_SkillCheckHackParam,
                  b+OFF_SendEventTypeHackClientFix,
                  b+OFF_IsCheatcodeRoom,
                  b+OFF_get_PlayerPrefCheatCode,
                  b+OFF_set_PlayerPrefCheatCode,
                  b+OFF_StartAttribute,
                  b+OFF_HackedIsStdLibraryPackage,
                  b+OFF_OnReceiveClanWarHackerNtf,
                  b+OFF_GetClanHackerRemindDetail,
                  b+OFF_RefreshHackView,
                  b+OFF_OnHackBtnClick_Action,
                  b+OFF_OnHackBtnRelease_Action,
                  b+OFF_OnHackBtnClick_Driver,
                  b+OFF_OnHackBtnRelease_Driver,
                  b+OFF_OnHackBtnClick_Passenger,
                  b+OFF_OnHackBtnRelease_Passenger,
                  b+OFF_HackNB2Transformer,
                  b+OFF_HackTestAddBpExp,
                  b+OFF_PreviewNB2HackTransformer,
                  b+OFF_HackShowNB2Transformer,
                  b+OFF_SetDesc_SkinMod
              };
              int count = sizeof(targets)/sizeof(targets[0]);
              for (int i = 0; i < count; i++) nop_fn(targets[i]);
          }

          __attribute__((constructor)) static void init() { applyPatches(); }
          CPPEOF

      - name: Download SDK (fast)
        run: |
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz
          mkdir -p /tmp/sdks
          tar -xJf /tmp/sdk.tar.xz -C /tmp/sdks/

      - name: Build dylib
        run: |
          clang++ -arch arm64 -dynamiclib \
            -isysroot /tmp/sdks/iPhoneOS16.5.sdk \
            -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc \
            -framework Foundation \
            -framework CoreFoundation \
            -o FreeFireBypass.dylib src/main.mm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-OB54-FULL
          path: FreeFireBypass.dylib
