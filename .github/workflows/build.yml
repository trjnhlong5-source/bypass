          static const uintptr_t OFF_ctor_DataChar_value                = 0x960B078;
          static const uintptr_t OFF_ctor_DataChar_finder               = 0x960B484;
          static const uintptr_t OFF_checkChecksum_Pair                 = 0x960BE2C;
          static const uintptr_t OFF_checkChecksum_DataChar             = 0x960F140;
          static const uintptr_t OFF_checksum_MD2Managed_44159          = 0x30;
          static const uintptr_t OFF_MD2Transform_44159                 = 0x89052DC;

          // ─── Runtime Offset Logger ────────────────────────────────────────────────────

          static uintptr_t getBase() {
              for (uint32_t i = 0; i < _dyld_image_count(); i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (name && strstr(name, "FFCM")) {
                      return (uintptr_t)_dyld_get_image_vmaddr_slide(i);
                  }
              }
              return 0;
          }

          __attribute__((constructor))
          static void init() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  uintptr_t base = getBase();
                  NSLog(@"[HexDev] ✅ Base Address: 0x%lx", base);

                  // spot-check a few resolved addresses at runtime
                  NSLog(@"[HexDev] LogReportCheat       -> 0x%lx", base + OFF_LogReportCheat);
                  NSLog(@"[HexDev] IsCheatcodeRoom      -> 0x%lx", base + OFF_IsCheatcodeRoom);
                  NSLog(@"[HexDev] GetffantihackEnabled -> 0x%lx", base + OFF_GetffantihackEnabled);
                  NSLog(@"[HexDev] SendHackerReport     -> 0x%lx", base + OFF_SendHackerReportRequest);
                  NSLog(@"[HexDev] RequestHackerStore   -> 0x%lx", base + OFF_RequestHackerStoreInfo);
                  NSLog(@"[HexDev] ShowHackerDetectedUI -> 0x%lx", base + OFF_ShowHackerDetectedUI);
                  NSLog(@"[HexDev] ExistHacker          -> 0x%lx", base + OFF_ExistHacker);
                  NSLog(@"[HexDev] get_CheckHacker      -> 0x%lx", base + OFF_get_CheckHacker);
                  NSLog(@"[HexDev] HFMCBHACKJL (obf)   -> 0x%lx", base + OFF_HFMCBHACKJL);
                  NSLog(@"[HexDev] MD2Transform (36413) -> 0x%lx", base + OFF_MD2Transform_36413);
                  NSLog(@"[HexDev] ✅ Tất cả offset đã resolve — HexDev-iOS");
              });
          }
          EOF

      - name: Compile dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib \
                -framework Foundation \
                -framework UIKit \
                -arch arm64 \
                -isysroot $SDK_PATH \
                -o libffoffsets.dylib libffoffsets.m

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libffoffsets.dylib
          path: libffoffsets.dylib

      - name: Download insert_dylib tool
        run: |
          curl -L -o insert_dylib https://github.com/tyilo/insert_dylib/releases/download/1.7.0/insert_dylib
          chmod +x insert_dylib

      - name: Upload insert_dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: insert_dylib
          path: insert_dylib
