name: Build FreeFireBypass Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Set THEOS path
        run: echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          brew install ldid
          brew install xz

      - name: Build dylib
        run: |
          make FINALPACKAGE=1

      - name: Find dylib
        run: |
          find . -name "*.dylib" | head -20

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-OB54
          path: |
            .theos/obj/FreeFireBypass.dylib
          retention-days: 30
