name: Build FreeFireBypass

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # macOS có sẵn toolchain iOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build dylib
        run: |
          export TARGET=iphone:clang:latest:14.0
          export ARCHS=arm64
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass.dylib
          path: .theos/obj/FreeFireBypass.dylib
