name: Build FreeFireBypass Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Theos (prebuilt)
        run: |
          curl -L https://github.com/theos/theos/archive/refs/heads/master.tar.gz -o theos.tar.gz
          tar -xzf theos.tar.gz
          mv theos-master $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download SDK iOS 16.5
        run: |
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o sdks.tar.gz
          tar -xzf sdks.tar.gz
          mkdir -p $HOME/theos/sdks
          cp -r sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH
          export TARGET=iphone:clang:latest:14.0
          export ARCHS=arm64
          make FINALPACKAGE=1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-OB54
          path: .theos/obj/FreeFireBypass.dylib
          retention-days: 30
