                  b+0x8464, b+0x8468, b+0x9A68, b+0x9A6C, b+0xA890,
                  b+0x148, b+0x160, b+0x149, b+0x190, b+0x110,
                  b+0x150, b+0x13C, b+0x98, b+0xB8, b+0xC8,
                  b+0x100, b+0xE8, b+0x170, b+0x178, b+0x180,
                  b+0x40, b+0x48, b+0x130, b+0x90, b+0xA0,
                  b+0x27, b+0x128, b+0x129, b+0x44, b+0x50,
                  b+0x1C, b+0x88, b+0x298, b+0x2A0, b+0x2A8,
                  b+0xA8, b+0x168, b+0x18B, b+0x18D, b+0x30,
                  b+0x1C8,
              };
              int count = sizeof(t)/sizeof(t[0]);
              for (int i = 0; i < count; i++) nop_fn(t[i]);
          }

          __attribute__((constructor)) static void init() { applyPatches(); }
          CPPEOF

      - name: Get SDK
        run: git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks

      - name: Build
        run: |
          clang++ -arch arm64 -dynamiclib \
            -isysroot /tmp/sdks/iPhoneOS16.5.sdk \
            -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc \
            -framework Foundation \
            -framework CoreFoundation \
            -o FreeFireBypass.dylib src/main.mm

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-1000PCT
          path: FreeFireBypass.dylib
