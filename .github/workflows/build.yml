name: Build FreeFireBypass Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          # Lấy submodule cần thiết (bao gồm makefiles)
          git submodule update --init --depth=1 --recursive
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $HOME/theos/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/
          # Nếu không có 16.5 thì dùng 15.5 hoặc 14.5
          ls $HOME/theos/sdks/

      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH
          export TARGET=iphone:clang:latest:14.0
          export ARCHS=arm64
          make FINALPACKAGE=1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-OB54
          path: .theos/obj/FreeFireBypass.dylib
          retention-days: 30
