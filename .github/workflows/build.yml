name: Build FreeFireBypass Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks

      - name: Build dylib
        run: |
          SDK=/tmp/sdks/iPhoneOS16.5.sdk
          clang++ \
            -arch arm64 \
            -dynamiclib \
            -isysroot $SDK \
            -miphoneos-version-min=14.0 \
            -std=c++17 \
            -fobjc-arc \
            -framework Foundation \
            -o FreeFireBypass.dylib \
            src/main.mm

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-OB54
          path: FreeFireBypass.dylib
          retention-days: 30
