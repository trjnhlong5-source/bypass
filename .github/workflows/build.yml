name: Build FreeFireBypass Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos + SDK
        run: |
          # Clone Theos (có submodule)
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          git submodule update --init --depth=1 --recursive

          # Tải SDK từ bản phát hành chính thức (không lo lỗi link)
          curl -L https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          mkdir -p $HOME/theos/sdks
          tar -xJf /tmp/sdk.tar.xz -C $HOME/theos/sdks/

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH
          export TARGET=iphone:clang:latest:14.0
          export ARCHS=arm64
          make FINALPACKAGE=1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireBypass-OB54
          path: .theos/obj/FreeFireBypass.dylib
          retention-days: 30
