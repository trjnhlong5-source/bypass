name: Build FF Bypass 1000PCT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create source
        run: |
          mkdir -p src
          cat > src/main.mm << 'CPPEOF'
          #include <mach-o/dyld.h>
          #include <mach/mach.h>
          #include <string.h>
          #include <stdint.h>
          #include <dispatch/dispatch.h>

          static void nop_fn(uintptr_t addr) {
              uint32_t ret = 0xD65F03C0;
              vm_address_t page = addr & ~(vm_page_size - 1);
              vm_protect(mach_task_self(), page, vm_page_size, false, VM_PROT_READ|VM_PROT_WRITE|VM_PROT_EXECUTE);
              *(uint32_t*)addr = ret;
              vm_protect(mach_task_self(), page, vm_page_size, false, VM_PROT_READ|VM_PROT_EXECUTE);
          }

          static uintptr_t getBase() {
              for (uint32_t i = 0; i < _dyld_image_count(); i++) {
                  const char* n = _dyld_get_image_name(i);
                  if (n && strstr(n, "UnityFramework"))
                      return (uintptr_t)_dyld_get_image_vmaddr_slide(i);
              }
              return 0;
          }

          static void applyPatches() {
              uintptr_t b = getBase();
              if (!b) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2*NSEC_PER_SEC), dispatch_get_main_queue(), ^{ applyPatches(); });
                  return;
              }
              uintptr_t t[] = {
                  // Functions
                  b+0x5729834, b+0x572A1E8, b+0x5F7BADC, b+0x6E5B6A4,
                  b+0x1F6C298, b+0x21B9D78, b+0x2691C48, b+0x269B3E0,
                  b+0x27EB5D0, b+0x30E6664, b+0x32A32D0, b+0x3420200,
                  b+0x38FBD7C, b+0x38FB6CC, b+0x3CD7904,
                  b+0x2160980, b+0x2160BAC, b+0x216139C,
                  b+0x33991AC, b+0x339C378, b+0x339C408,
                  b+0x33A2314, b+0x33A62AC, b+0x33A633C,
                  b+0x3E5F8D8, b+0x3E5FBBC,
                  b+0x3E58B64, b+0x3E58D3C,
                  b+0x469A6BC, b+0x469AF60,
                  b+0x4801148, b+0x3729790,
                  b+0x3E2DB8C, b+0x3E2FD98, b+0x3E2FECC,
                  b+0x44A9378, b+0x44B49DC, b+0x44B4A34,
                  b+0x44A78C8, b+0x44AFCA8,
                  b+0x59E321C, b+0x5411AA0, b+0x5740048,
                  b+0x1AFB0F4, b+0x1F6BBBC,
                  b+0x206DEC4, b+0x20703F0,
                  b+0x21A1694, b+0x294B3AC,
                  b+0x36DBE9C,
                  b+0x40D9AFC, b+0x40D9C24,
                  b+0x424FB5C, b+0x424FBE4,
                  b+0x5F70D78,
                  b+0x6E617A4, b+0x6E674A0,
                  b+0x312B714,
                  b+0x469811C, b+0x469885C, b+0x4698A48,
                  b+0x4727C10, b+0x47280F0, b+0x47286B8,
                  b+0x4E6DFA4, b+0x521AE04,
                  b+0x2B41DEC, b+0x2B4253C, b+0x2B428EC,
                  b+0x41BF9F0, b+0x41CDE00,
